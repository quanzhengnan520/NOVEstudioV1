name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: TypeScript check (backend)
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Lint (frontend)
        working-directory: frontend
        run: npx next lint --no-cache 2>/dev/null || echo "Lint not configured yet"

      - name: Build (backend)
        working-directory: backend
        run: npm run build

      - name: Build (frontend)
        working-directory: frontend
        run: npm run build

      - name: Test (backend)
        working-directory: backend
        run: npx vitest run
        env:
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          NODE_ENV: test

      - name: Test (frontend)
        working-directory: frontend
        run: npx vitest run
